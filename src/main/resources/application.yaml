app:
  cors:
    allowed-headers: "authorization, accept, content-type, x-requested-with"
    allowed-methods: "GET, POST, PUT, DELETE, HEAD, OPTIONS"
    allowed-origins: "http://localhost:4200"

server:
  port: 9000

logging:
  level:
    org.springframework.security: info

spring:
  application:
    name: authorization-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:3306/authorization_server
    username: ${DB_USERNAME:root}
    password: ${DB_USERNAME:toor}
  jpa:
    hibernate:
      ddl-auto: validate
